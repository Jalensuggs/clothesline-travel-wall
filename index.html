<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>晾着的旅程 · Clothesline Travel Wall</title>
    <meta name="description" content="把旅行照片夹在一根会晃动的绳子上：拖动浏览、点开翻面看游记、回放路线。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Long+Cang&family=Noto+Serif+SC:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧺</text></svg>" />
  </head>
  <body>
    <div class="wall" aria-hidden="true">
      <div class="wall-day"></div>
      <div class="wall-night"></div>
      <div class="watermark" id="watermark">
        <span class="wm-place" id="wmPlace"></span>
        <span class="wm-meta" id="wmMeta"></span>
      </div>
    </div>

    <canvas id="stage" aria-label="旅行照片墙，拖动浏览，点击照片查看详情"></canvas>

    <header class="top">
      <div class="brand">
        <h1>晾着的旅程</h1>
        <p id="stats" class="stats"></p>
      </div>
      <nav class="trips" id="trips" aria-label="选择旅程"></nav>
    </header>

    <div class="filters" id="filters" aria-label="按标签筛选"></div>

    <p class="hint" id="hint">拖动绳子浏览 · 点击照片取下来看看</p>

    <div class="dock" id="dock" role="toolbar" aria-label="控制">
      <button data-action="play" title="回放旅程（空格）">
        <svg viewBox="0 0 24 24"><path class="i-play" d="M8 5.5v13l11-6.5z" /><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg>
        <span>回放旅程</span>
      </button>
      <button data-action="night" title="夜晚串灯（N）">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        <span>夜晚</span>
      </button>
      <button data-action="wind" title="起风（W）">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 9h11a3 3 0 1 0-3-3M3 14h15a3 3 0 1 1-3 3M3 19h6" /></svg>
        <span>起风</span>
      </button>
      <span class="dock-sep"></span>
      <button data-action="add" class="primary" title="添加照片">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        <span>添加照片</span>
      </button>
      <span class="dock-sep"></span>
      <button data-action="map" title="路线地图">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14" /></svg>
      </button>
      <button data-action="sound" title="音效（M）">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" /><path class="i-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="i-mute" d="m17 9 5 6m0-6-5 6" /></svg>
      </button>
    </div>

    <aside class="minimap" id="minimap" aria-label="路线地图"></aside>

    <div class="dropzone" id="dropzone" hidden>
      <div class="dz-inner">
        <div class="dz-pin"></div>
        <strong>松手，把照片夹到绳子上</strong>
        <span>会自动读取拍摄时间和 GPS 位置，只保存在你的浏览器里</span>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden />

    <div class="lightbox" id="lightbox" hidden>
      <div class="lb-backdrop" data-close></div>
      <button class="lb-nav lb-prev" data-nav="-1" aria-label="上一张">
        <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
      </button>
      <button class="lb-nav lb-next" data-nav="1" aria-label="下一张">
        <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
      </button>
      <div class="lb-card" id="lbCard">
        <div class="lb-flipper">
          <div class="lb-face lb-front"></div>
          <div class="lb-face lb-back"></div>
        </div>
      </div>
      <div class="lb-bar">
        <div class="lb-info">
          <span class="lb-count" id="lbCount"></span>
          <span class="lb-title" id="lbTitle"></span>
        </div>
        <div class="lb-actions">
          <button data-lb="flip"><kbd>F</kbd> 翻到背面</button>
          <button data-lb="export">导出明信片</button>
          <button data-lb="delete" class="danger" hidden>取下这张</button>
          <button data-lb="close"><kbd>Esc</kbd> 挂回去</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
